aid: champions-oncology
name: Champions Oncology
description: >-
  Champions Oncology (NASDAQ: CSBR) is a global preclinical and clinical
  oncology contract research organization (CRO) supporting pharmaceutical and
  biotech drug development from discovery through the clinic. It maintains a
  living bank of more than 1,400 patient-derived tumor models and primary
  hematological models, and offers proprietary in vivo and ex vivo platforms,
  next-generation sequencing (WES/RNASeq), quantitative and phospho-proteomics,
  flow cytometry, and other analytical assays. Its Lumin Bioinformatics platform
  is an integrated, no-code analytics and visualization solution built on
  precisely curated multi-omics oncology data assembled from over 12,000 cancer
  patients, exposing gene networks, molecular signatures, target discovery, and
  AI-driven predictive analytics to researchers. Champions was surfaced as a
  portfolio company of Battery Ventures and added to the API Evangelist network.
